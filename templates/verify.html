<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Потвърждение на профил — ПГМЕТ Плевен</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-xl p-8 shadow-2xl">
        <div class="mb-6">
            <span class="text-xs uppercase tracking-wider text-sky-400 font-semibold">ПГМЕТ • Плевен</span>
            <h1 class="text-2xl font-bold mt-1">Потвърди имейла си</h1>
            <p class="text-sm text-zinc-400 mt-1">Въведи 6-цифрения код, изпратен на <strong class="text-zinc-200">{{ email }}</strong>.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-950/60 text-red-300 border border-red-800{% else %}bg-emerald-950/60 text-emerald-300 border border-emerald-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-zinc-300 mb-1">Код за потвърждение</label>
                <input type="text" name="code" maxlength="6" required placeholder="123456"
                       class="w-full px-3.5 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-white text-center text-2xl tracking-widest font-mono focus:outline-none focus:border-sky-500">
            </div>

            <button type="submit"
                    class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-lg transition shadow-lg shadow-sky-600/20">
                Потвърди профила
            </button>
        </form>
    </div>
</body>
</html>
